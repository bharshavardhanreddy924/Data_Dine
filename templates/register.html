<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.0-beta2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 350px; /* Smaller container */
            width: 90%; /* Responsive width */
            animation: fadeInUp 1s ease-in-out;
        }
        h1 {
            color: #d9534f;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px; /* Reduced margin */
            font-size: 20px; /* Smaller heading */
        }
        .form-label {
            font-weight: 600;
            color: #333;
            font-size: 12px; /* Smaller labels */
            margin-bottom: 3px; /* Reduced margin */
        }
        .form-control {
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 6px; /* Smaller padding */
            transition: all 0.3s ease;
            font-size: 12px; /* Smaller font size */
            margin-bottom: 10px; /* Reduced margin */
        }
        .form-control:focus {
            border-color: #d9534f;
            box-shadow: 0 0 6px rgba(217, 83, 79, 0.3);
        }
        .btn-primary {
            background-color: #d9534f;
            border-color: #d9534f;
            border-radius: 6px;
            padding: 6px 12px; /* Smaller button */
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 12px; /* Smaller font size */
        }
        .btn-primary:hover {
            background-color: #c9302c;
            border-color: #c9302c;
            transform: translateY(-2px);
        }
        .alert {
            border-radius: 6px;
            font-size: 12px; /* Smaller alert text */
            padding: 6px; /* Smaller padding */
            margin-bottom: 10px; /* Reduced margin */
        }
        .mt-3 {
            text-align: center;
            font-size: 12px; /* Smaller text */
            margin-top: 10px; /* Reduced margin */
        }
        .mt-3 a {
            color: #d9534f;
            text-decoration: none;
            font-weight: 600;
        }
        .mt-3 a:hover {
            text-decoration: underline;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container animate__animated animate__fadeInUp">
        <h1>Register</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-2">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" id="first_name" name="first_name" class="form-control" required>
            </div>
            <div class="mb-2">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" id="last_name" name="last_name" class="form-control" required>
            </div>
            <div class="mb-2">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="mb-2">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>
            <div class="mb-2">
                <label for="phone_number" class="form-label">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <div class="mt-3">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.0-beta2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
