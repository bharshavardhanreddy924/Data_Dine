{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6 max-w-2xl">
    <h1 class="text-3xl font-bold mb-6 text-center" style="color: #2c3e50;">Add New Ingredient</h1>
    
    <!-- Add Ingredient Form -->
    <form method="POST" action="/admin/add_ingredient">
        <!-- Ingredient Name -->
        <div class="mb-4">
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                <i class="fas fa-tag text-gray-600 mr-2"></i>Ingredient Name
            </label>
            <input type="text" class="form-control w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="name" name="name" required>
        </div>

        <!-- Quantity In Stock -->
        <div class="mb-4">
            <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">
                <i class="fas fa-boxes text-gray-600 mr-2"></i>Quantity In Stock
            </label>
            <input type="number" class="form-control w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="quantity" name="quantity" min="0" required>
        </div>

        <!-- Unit -->
        <div class="mb-4">
            <label for="unit" class="block text-sm font-medium text-gray-700 mb-1">
                <i class="fas fa-balance-scale text-gray-600 mr-2"></i>Unit
            </label>
            <input type="text" class="form-control w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="unit" name="unit" required>
        </div>

        <!-- Reorder Level -->
        <div class="mb-4">
            <label for="reorder_level" class="block text-sm font-medium text-gray-700 mb-1">
                <i class="fas fa-exclamation-triangle text-gray-600 mr-2"></i>Reorder Level
            </label>
            <input type="number" class="form-control w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="reorder_level" name="reorder_level" min="0" required>
        </div>

        <!-- Expiry Date -->
        <div class="mb-4">
            <label for="expiry_date" class="block text-sm font-medium text-gray-700 mb-1">
                <i class="fas fa-calendar-times text-gray-600 mr-2"></i>Expiry Date
            </label>
            <input type="date" class="form-control w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="expiry_date" name="expiry_date" required>
        </div>

        <!-- Supplier -->
        <div class="mb-4">
            <label for="supplier" class="block text-sm font-medium text-gray-700 mb-1">
                <i class="fas fa-truck text-gray-600 mr-2"></i>Supplier
            </label>
            <input type="text" class="form-control w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="supplier" name="supplier">
        </div>

        <!-- Unit Cost -->
        <div class="mb-6">
            <label for="unit_cost" class="block text-sm font-medium text-gray-700 mb-1">
                <i class="fas fa-rupee-sign text-gray-600 mr-2"></i>Unit Cost
            </label>
            <input type="number" class="form-control w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="unit_cost" name="unit_cost" step="0.01" min="0">
        </div>

        <!-- Submit Button -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-600 transition-colors">
                <i class="fas fa-plus-circle mr-2"></i>Add Ingredient
            </button>
        </div>
    </form>
</div>

<!-- Styles -->
<style>
    .form-control {
        transition: all 0.2s ease;
    }
    .form-control:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .btn-primary {
        transition: all 0.2s ease;
    }
    .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
</style>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}
