{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <h3 class="text-center mb-4" style="color: #2c3e50; font-weight: 600;">Add New Dish</h3>
    
    <!-- Add Dish Form -->
    <form method="POST" action="/admin/add_dish" enctype="multipart/form-data" class="bg-white p-4 rounded shadow-sm">
        <!-- Dish Name -->
        <div class="mb-3">
            <label for="dish_name" class="form-label">
                <i class="fas fa-utensils me-2"></i>Dish Name
            </label>
            <input type="text" class="form-control" id="dish_name" name="dish_name" required>
        </div>

        <!-- Price -->
        <div class="mb-3">
            <label for="price" class="form-label">
                <i class="fas fa-rupee-sign me-2"></i>Price
            </label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" required>
        </div>

        <!-- Portion Size -->
        <div class="mb-3">
            <label for="portion_size" class="form-label">
                <i class="fas fa-weight me-2"></i>Portion Size
            </label>
            <input type="text" class="form-control" id="portion_size" name="portion_size" required>
        </div>

        <!-- Cuisine -->
        <div class="mb-3">
            <label for="cuisine" class="form-label">
                <i class="fas fa-globe me-2"></i>Cuisine
            </label>
            <input type="text" class="form-control" id="cuisine" name="cuisine" required>
        </div>

        <!-- Category -->
        <div class="mb-3">
            <label for="category" class="form-label">
                <i class="fas fa-tags me-2"></i>Category
            </label>
            <input type="text" class="form-control" id="category" name="category" required>
        </div>

        <!-- Preparation Time -->
        <div class="mb-3">
            <label for="prep_time" class="form-label">
                <i class="fas fa-clock me-2"></i>Preparation Time (minutes)
            </label>
            <input type="number" class="form-control" id="prep_time" name="prep_time" required>
        </div>

        <!-- Allergens -->
        <div class="mb-3">
            <label class="form-label">
                <i class="fas fa-allergies me-2"></i>Allergens
            </label>
            <div class="d-flex flex-wrap gap-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="wheat" name="wheat">
                    <label class="form-check-label" for="wheat">Wheat</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="milk" name="milk">
                    <label class="form-check-label" for="milk">Milk</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="soy" name="soy">
                    <label class="form-check-label" for="soy">Soy</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="peanut" name="peanut">
                    <label class="form-check-label" for="peanut">Peanut</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="egg" name="egg">
                    <label class="form-check-label" for="egg">Egg</label>
                </div>
            </div>
        </div>

        <!-- Image Upload -->
        <div class="mb-4">
            <label for="image" class="form-label">
                <i class="fas fa-image me-2"></i>Dish Image
            </label>
            <input type="file" class="form-control" id="image" name="image">
        </div>

        <!-- Submit Button -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-plus-circle me-2"></i>Add Dish
            </button>
        </div>
    </form>
</div>

<!-- Styles -->
<style>
    .form-control {
        border-radius: 8px;
        border: 1px solid #ddd;
        padding: 10px;
    }
    
    .form-control:focus {
        border-color: #2c3e50;
        box-shadow: 0 0 5px rgba(44, 62, 80, 0.2);
    }
    
    .form-check-input:checked {
        background-color: #2c3e50;
        border-color: #2c3e50;
    }
    
    .btn-primary {
        background-color: #2c3e50;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
        background-color: #1a252f;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .form-label {
        font-weight: 500;
        color: #2c3e50;
    }
    
    .bg-white {
        background-color: #fff;
    }
    
    .shadow-sm {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
</style>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}
