{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <h2 class="text-center mb-4" style="color: #2c3e50; font-weight: 600;">Edit Dish</h2>
    
    <form action="{{ url_for('edit_dish', dish_id=dish._id) }}" method="POST" enctype="multipart/form-data" class="bg-white p-4 rounded shadow-sm">
        <!-- Dish Name -->
        <div class="mb-3">
            <label for="dish_name" class="form-label">
                <i class="fas fa-utensils me-2"></i>Dish Name
            </label>
            <input type="text" class="form-control" id="dish_name" name="dish_name" value="{{ dish.DishName }}" required>
        </div>

        <!-- Price -->
        <div class="mb-3">
            <label for="price" class="form-label">
                <i class="fas fa-rupee-sign me-2"></i>Price
            </label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ dish.Price }}" required>
        </div>

        <!-- Portion Size -->
        <div class="mb-3">
            <label for="portion_size" class="form-label">
                <i class="fas fa-weight me-2"></i>Portion Size
            </label>
            <input type="text" class="form-control" id="portion_size" name="portion_size" value="{{ dish.PortionSize }}" required>
        </div>

        <!-- Cuisine -->
        <div class="mb-3">
            <label for="cuisine" class="form-label">
                <i class="fas fa-globe me-2"></i>Cuisine
            </label>
            <input type="text" class="form-control" id="cuisine" name="cuisine" value="{{ dish.Cuisine }}" required>
        </div>

        <!-- Category -->
        <div class="mb-3">
            <label for="category" class="form-label">
                <i class="fas fa-tags me-2"></i>Category
            </label>
            <input type="text" class="form-control" id="category" name="category" value="{{ dish.Category }}" required>
        </div>

        <!-- Preparation Time -->
        <div class="mb-3">
            <label for="prep_time" class="form-label">
                <i class="fas fa-clock me-2"></i>Preparation Time (minutes)
            </label>
            <input type="number" class="form-control" id="prep_time" name="prep_time" value="{{ dish.PreparationTime }}" required>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label for="description" class="form-label">
                <i class="fas fa-align-left me-2"></i>Description
            </label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ dish.Description }}</textarea>
        </div>

        <!-- Current Image -->
        <div class="mb-3">
            <label class="form-label">
                <i class="fas fa-image me-2"></i>Current Image
            </label>
            {% if dish.Image %}
                <img src="{{ url_for('static', filename='images/' + dish.Image) }}" 
                     alt="{{ dish.DishName }}" 
                     class="img-thumbnail" 
                     style="max-width: 200px;">
            {% else %}
                <p class="text-muted">No image available</p>
            {% endif %}
        </div>

        <!-- Update Image -->
        <div class="mb-3">
            <label for="image" class="form-label">
                <i class="fas fa-upload me-2"></i>Update Image
            </label>
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
        </div>

        <!-- Availability -->
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="is_available" name="is_available" {% if dish.IsAvailable %}checked{% endif %}>
            <label class="form-check-label" for="is_available">
                <i class="fas fa-check-circle me-2"></i>Available
            </label>
        </div>

        <!-- Allergens -->
        <div class="mb-4">
            <h4 class="mb-3">
                <i class="fas fa-allergies me-2"></i>Allergens
            </h4>
            <div class="d-flex flex-wrap gap-3">
                {% for allergen in ['Wheat', 'Milk', 'Soy', 'Peanut', 'Egg'] %}
                <div class="form-check">
                    <input type="checkbox" 
                           class="form-check-input" 
                           id="{{ allergen.lower() }}" 
                           name="{{ allergen.lower() }}" 
                           {% if dish.Allergens and dish.Allergens.get(allergen) %}checked{% endif %}>
                    <label class="form-check-label" for="{{ allergen.lower() }}">{{ allergen }}</label>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Buttons -->
        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg me-3">
                <i class="fas fa-save me-2"></i>Update Dish
            </button>
            <a href="{{ url_for('admin_menu') }}" class="btn btn-secondary btn-lg">
                <i class="fas fa-times me-2"></i>Cancel
            </a>
        </div>
    </form>
</div>

<!-- Styles -->
<style>
    .form-control {
        border-radius: 8px;
        border: 1px solid #ddd;
        padding: 10px;
    }
    
    .form-control:focus {
        border-color: #2c3e50;
        box-shadow: 0 0 5px rgba(44, 62, 80, 0.2);
    }
    
    .form-check-input:checked {
        background-color: #2c3e50;
        border-color: #2c3e50;
    }
    
    .btn-primary {
        background-color: #2c3e50;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
        background-color: #1a252f;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .btn-secondary {
        background-color: #6c757d;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        transition: all 0.3s ease;
    }
    
    .btn-secondary:hover {
        background-color: #5a6268;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .form-label {
        font-weight: 500;
        color: #2c3e50;
    }
    
    .bg-white {
        background-color: #fff;
    }
    
    .shadow-sm {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .img-thumbnail {
        transition: all 0.2s;
    }
    
    .img-thumbnail:hover {
        transform: scale(1.05);
    }
</style>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}
